# Construye la imagen del backend Vendure, la publica en GHCR y la despliega en un VPS por SSH.
# Configuración de secretos y del servidor: ver "Deploy with GitHub Actions" en README.md.

name: Deploy server

on:
    push:
        branches: [main]
        paths:
            - 'apps/server/**'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - 'package.json'
            - 'docker-compose.prod.yml'
            - '.github/workflows/deploy-server.yml'
    workflow_dispatch:

# Un deploy a la vez; si llega otro push, espera en vez de pisar el que está en curso.
concurrency:
    group: deploy-server
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.meta.outputs.image }}
        steps:
            - uses: actions/checkout@v4

            - name: Nombre de la imagen
              id: meta
              # GHCR exige minúsculas; el owner o el repo pueden tener mayúsculas.
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/server/Dockerfile
                  push: true
                  tags: |
                      ${{ steps.meta.outputs.image }}:${{ github.sha }}
                      ${{ steps.meta.outputs.image }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        needs: build
        runs-on: ubuntu-latest
        # Usa un Environment "production" en GitHub si quieres aprobación manual y secretos acotados.
        environment: production
        permissions:
            contents: read
            packages: read
        env:
            DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
            DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
            # Directorio del servidor donde viven docker-compose.prod.yml y .env.prod.
            DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'alegria' }}
        steps:
            - uses: actions/checkout@v4

            - name: Preparar SSH
              env:
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
                  chmod 600 ~/.ssh/id_deploy
                  # Se verifica la huella del servidor (no se confía en el primer contacto).
                  printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
                  cat > ~/.ssh/config <<EOF
                  Host deploy
                      HostName ${DEPLOY_HOST}
                      User ${DEPLOY_USER}
                      Port ${DEPLOY_PORT}
                      IdentityFile ~/.ssh/id_deploy
                      IdentitiesOnly yes
                      StrictHostKeyChecking yes
                  EOF

            - name: Copiar docker-compose.prod.yml
              run: |
                  ssh deploy "mkdir -p '${DEPLOY_PATH}'"
                  scp docker-compose.prod.yml "deploy:${DEPLOY_PATH}/docker-compose.prod.yml"

            - name: Desplegar
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
                  SERVER_IMAGE: ${{ needs.build.outputs.image }}
                  IMAGE_TAG: ${{ github.sha }}
              # El script viaja por stdin (el token no aparece en la línea de comandos ni en el historial del servidor).
              # `up --wait` falla el job si el server no queda sano (healthcheck /health) en 3 minutos.
              run: |
                  ssh deploy bash -s <<REMOTE
                  set -euo pipefail
                  cd '${DEPLOY_PATH}'
                  printf '%s' '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USER}' --password-stdin
                  export SERVER_IMAGE='${SERVER_IMAGE}' IMAGE_TAG='${IMAGE_TAG}'
                  COMPOSE="docker compose --env-file .env.prod -f docker-compose.prod.yml"
                  \$COMPOSE pull server worker
                  \$COMPOSE up -d --no-build --remove-orphans --wait --wait-timeout 180
                  docker logout ghcr.io
                  docker image prune -f
                  \$COMPOSE ps
                  REMOTE
